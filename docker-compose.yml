version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medilingua_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medilingua
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medilingua_network

networks:
  medilingua_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
